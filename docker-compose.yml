name: warpcart

services:
  db:
    image: postgres:16-alpine
    container_name: warpcart-db
    environment:
      POSTGRES_USER: warpcart
      POSTGRES_PASSWORD: warpcart
      POSTGRES_DB: warpcart
    # pg_stat_statements lets the stampede benchmark count real queries on the DB side.
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=256MB
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warpcart -d warpcart"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: warpcart-redis
    # Pure cache: no persistence. volatile-lru only evicts keys that have a TTL,
    # so the (TTL-less) search version counters are never evicted.
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --save ""
      --appendonly no
    ports:
      - "6371:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    container_name: warpcart-api
    environment:
      DATABASE_URL: postgresql+asyncpg://warpcart:warpcart@db:5432/warpcart
      TEST_DATABASE_URL: postgresql+asyncpg://warpcart:warpcart@db:5432/warpcart_test
      REDIS_URL: redis://redis:6379/0
      TEST_REDIS_URL: redis://redis:6379/15
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      STAMPEDE_STRATEGY: ${STAMPEDE_STRATEGY:-lock}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SEED_PRODUCTS: ${SEED_PRODUCTS:-500000}
      WEB_WORKERS: ${WEB_WORKERS:-4}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      # First boot runs migrations and seeds 500k rows before the server starts.
      start_period: 600s

volumes:
  pgdata:
